[project]
name = "recollect-probe"
version = "0.1.0"
description = "Prompt A/B harness for Recollect"
license = "MIT"
requires-python = ">=3.12.4"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "recollect",
    "pydantic>=2.0",
]

[project.scripts]
probe = "probe_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe_cli"]

[tool.uv.sources]
recollect = { workspace = true }
