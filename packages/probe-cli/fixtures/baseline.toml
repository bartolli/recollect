# Baseline arm: packaged-default extraction prompt, no override.
# Run with: uv run probe run --arm packages/probe-cli/fixtures/baseline.toml
#
# Requires PYDANTIC_AI_MODEL provider keys in .env (e.g. ANTHROPIC_API_KEY) or
# a local Ollama instance. Hits the real LLM — tokens cost money.

[arm]
name = "baseline"
runs = 3

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"
# template_path = ""  # empty -> packaged default
max_concepts = 5
max_relations = 3

[corpus]
path = "packages/probe-cli/fixtures/smoke.jsonl"

[output]
dir = "out"
