# P6 situational arm — OpenRouter (google/gemini-3-flash-preview, reasoning enabled). Same fixture as situational/baseline.toml.
# Routing: pydantic-ai resolves OPENROUTER_API_KEY from env (Makefile loads .env via uv run --env-file).
# DB: probe_situational, drop+recreate before run via `make probe-situational-openrouter`.

[arm]
name = "situational-openrouter"
runs = 3

[extraction]
pydantic_ai_model = "openrouter:google/gemini-3-flash-preview"

[extraction.model_settings]
openrouter_reasoning = { enabled = true }

[corpus]
path = ""

[output]
dir = "out"

[situational]
enabled = true
db_url = "${RECOLLECT_PROBE_SITUATIONAL_DB_URL}"
seed_traces_path = "packages/probe-cli/fixtures/situational/seed_traces.jsonl"
seed_groups_path = "packages/probe-cli/fixtures/situational/seed_groups.jsonl"
eval_corpus_path = "packages/probe-cli/fixtures/situational/eval.jsonl"
