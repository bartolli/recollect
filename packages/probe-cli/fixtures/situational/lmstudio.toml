# .env OLLAMA_BASE_URL must point at LM Studio for this arm (same var gemma.toml uses for Ollama).
# thinking = false → reasoning_effort=none; required for thinking-mode models to route structured output to content.

[arm]
name = "situational-lmstudio"
runs = 3

[extraction]
pydantic_ai_model = "ollama:qwen3-6"

[extraction.model_settings]
# thinking = false

[corpus]
path = ""

[output]
dir = "out"

[situational]
enabled = true
db_url = "postgresql://bartolli@localhost:5432/probe_situational"
seed_traces_path = "packages/probe-cli/fixtures/situational/seed_traces.jsonl"
seed_groups_path = "packages/probe-cli/fixtures/situational/seed_groups.jsonl"
eval_corpus_path = "packages/probe-cli/fixtures/situational/eval.jsonl"
