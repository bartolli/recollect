# Dense retrieval + relation context_tags embedded as trace concepts.
# Three-way A/B: eval.toml (default prompt) vs dense-retrieval.toml (dense prompt)
# vs this arm (dense + tag embed). Reset probe_eval DB before measurement.
#   uv run probe run --arm packages/probe-cli/fixtures/dense-retrieval-tag-embed.toml

[arm]
name = "dense-retrieval-tag-embed-k3"
runs = 3

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"
template_path = "packages/probe-cli/fixtures/extraction.dense.md"
instructions = ""
max_concepts = 5
max_relations = 3

[corpus]
path = "packages/probe-cli/fixtures/eval_traces.jsonl"

[retrieval]
enabled = true
db_url = "${RECOLLECT_PROBE_DB_URL}"
traces_corpus_path = "packages/probe-cli/fixtures/eval_traces.jsonl"
query_corpus_path = "packages/probe-cli/fixtures/eval_queries.jsonl"
token_budget = 100000
top_k = 3
max_retrievals_buffer = 50

[recollect_overrides]
"persona.auto_extract" = false
"recall_tokens.enabled" = false
"extraction.embed_relation_tags" = true

[output]
dir = "out"
