# Fresh-DB unbounded control (story-8 slice-3 f2 replicate pair, with task-wbound-f2).
# Code: main e16278a; same state as the treatment arm; the margin sentinel restores the
# pre-bound formula exactly (unit-pinned: test_negative_margin_disables_bound).
# Mode: --verify-reachability -- presence + raw_rank + window, one seeding.
# DB: fresh probe_task (make probe-task-db-reset immediately before).

[arm]
name = "task-nobound-f2"
runs = 1

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"

# Required by Arm schema; unused for task arms.
[corpus]
path = ""

[output]
dir = "out"

[recollect_overrides]
"recall_tokens.witness_bound_margin" = -1.0

[task]
enabled = true
db_url = "${RECOLLECT_PROBE_TASK_DB_URL}"
seed_traces_path = "packages/probe-cli/fixtures/task/seed_traces.jsonl"
questions_path = "packages/probe-cli/fixtures/task/questions.jsonl"
answer_model = "anthropic:claude-haiku-4-5-20251001"
density_tier = 0
with_recall = true
with_priming = true
with_tokens = true
