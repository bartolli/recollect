# Fresh-DB control arm (story-8 Gate 2 falsification pair, with task-gated-f1).
# Pre-gating scoring: runs on branch probe/ctrl-f1 = main + revert of 3481e22
# (flat salience, flat fact-confidence; the commit's test pins revert with it).
# Story-11 fact-write scope (f5a995a) stays in -- behavior-neutral on a fresh
# single-user DB, so gating is the sole treatment across the pair. The branch
# is the provenance record; it never merges.
# Mode: --verify-reachability -- presence + raw_rank + window, one seeding.
# DB: fresh probe_task (make probe-task-db-reset immediately before).

[arm]
name = "task-ctrl-f1"
runs = 1

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"

# Required by Arm schema; unused for task arms.
[corpus]
path = ""

[output]
dir = "out"

[task]
enabled = true
db_url = "${RECOLLECT_PROBE_TASK_DB_URL}"
seed_traces_path = "packages/probe-cli/fixtures/task/seed_traces.jsonl"
questions_path = "packages/probe-cli/fixtures/task/questions.jsonl"
answer_model = "anthropic:claude-haiku-4-5-20251001"
density_tier = 0
with_recall = true
with_priming = true
with_tokens = true
