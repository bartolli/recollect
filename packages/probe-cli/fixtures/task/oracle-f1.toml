# Fresh-DB oracle baseline (story-1 slice-0 supersession). Answering mode on
# HEAD: verdict_oracle.json from a position-1 seeding supersedes task-oracle's
# demonstration-grade numbers -- that arm ran at the tail of an accumulated
# probe_task with a starved fact channel and a dead within-user entity graph
# (story-11 / story-12 order-dependence class).
# DB: fresh probe_task (make probe-task-db-reset immediately before).

[arm]
name = "task-oracle-f1"
runs = 1

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"

# Required by Arm schema; unused for task arms.
[corpus]
path = ""

[output]
dir = "out"

[task]
enabled = true
db_url = "${RECOLLECT_PROBE_TASK_DB_URL}"
seed_traces_path = "packages/probe-cli/fixtures/task/seed_traces.jsonl"
questions_path = "packages/probe-cli/fixtures/task/questions.jsonl"
answer_model = "anthropic:claude-haiku-4-5-20251001"
density_tier = 0
with_recall = true
with_priming = true
with_tokens = true
