# Relation-tag embedding ON, d2: each relation's context_tags join the
# trace's concept embeddings (extraction.embed_relation_tags).
# Run: --verify-reachability
# Control: task-tags-ctrl-d2 (same code, key at its packaged default).
# Code: the commit that adds this arm.
# DB: fresh probe_task (make probe-task-db-reset immediately before).

[arm]
name = "task-tags-d2"
runs = 1

[extraction]
pydantic_ai_model = "anthropic:claude-haiku-4-5-20251001"

# Required by Arm schema; unused for task arms.
[corpus]
path = ""

[output]
dir = "out"

[recollect_overrides]
"extraction.embed_relation_tags" = true

[task]
enabled = true
db_url = "${RECOLLECT_PROBE_TASK_DB_URL}"
seed_traces_path = "packages/probe-cli/fixtures/task/seed_traces.jsonl"
questions_path = "packages/probe-cli/fixtures/task/questions.jsonl"
answer_model = "anthropic:claude-haiku-4-5-20251001"
density_tier = 2
with_recall = true
with_priming = true
with_tokens = true
